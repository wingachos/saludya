services:
  postgres:
    image: postgres:16-alpine
    container_name: saludya-postgres
    environment:
      POSTGRES_DB: saludya
      POSTGRES_USER: saludya
      POSTGRES_PASSWORD: saludya
    ports:
      - "5432:5432"
    volumes:
      - saludya_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U saludya -d saludya"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  saludya_postgres_data:
